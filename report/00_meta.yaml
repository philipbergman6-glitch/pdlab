---
title: "The Prisoner's Dilemma: Theory, Tournaments, Evolution, and Noise"
author: "Philip Bergman"
date: "2026"
abstract: |
  We study the Prisoner's Dilemma from three angles and test each numerically. Analytically we prove strict dominance and uniqueness of the one-shot equilibrium, backward induction for the finitely repeated game, the discount thresholds for Grim Trigger and Tit-for-Tat in the infinitely repeated game (including the knife-edge on which TFT is subgame perfect), the folk theorems, and the complete phase portrait of the replicator dynamics for ALLC, ALLD and TFT with symbolic Jacobian spectra. Numerically, a purpose-built Python laboratory (pdlab) reproduces every threshold by geometric-stopping simulation, runs an eighteen-strategy Axelrod tournament with and without implementation noise, integrates the replicator equation, simulates the Moran process against exact fixation probabilities, and reproduces the Nowak-May spatial cooperator fraction ({{spatial.coop_1p8_2|.3f}} versus the published 0.318). As an original contribution we treat memory-one strategies under implementation error as an exact four-state Markov chain, proving that Tit-for-Tat's self-play payoff drops discontinuously to (T+R+P+S)/4 for any positive error rate while generous strategies lose only linearly, show that selection under noise follows that ranking, and test Press-Dyson extortion against a Q-learning opponent: the learner is pinned to the extortion line but stops short of the full cooperation an idealised adaptive opponent would reach, while extortion itself goes extinct in populations. All results regenerate from a single command and are cross-checked against an independent implementation.
