[project]
name = "pdlab"
version = "0.1.0"
description = "Prisoner's Dilemma laboratory: theory, tournaments, evolution, spatial games"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Philip Bergman" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "sympy>=1.12",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "scipy-stubs; python_version >= '3.11'",
  "imageio>=2.34",
  "pillow>=10",
]

[project.scripts]
pdlab = "pdlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pdlab --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["pdlab"]
branch = true
omit = ["src/pdlab/__main__.py"]

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "N806", "N803", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

files = ["src/pdlab"]
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "sympy.*", "imageio.*"]
ignore_missing_imports = true
